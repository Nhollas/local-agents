branch:
  model: claude-haiku-4-5
  prompt: |
    <task>
    Propose a git branch name for this issue.
    </task>

    <issue key="{{ issue.key }}" title="{{ issue.title }}">
    {{ issue.description }}
    </issue>

    <format>
    `<type>/<issue-key>-<short-desc>`

    - `type`: one of `feat`, `fix`, `chore`, `docs`, `refactor`, `test`. Pick
      what best matches the work — `feat` for new behaviour, `fix` for bugs,
      `refactor` for non-behavioural restructuring, etc.
    - `issue-key`: tracker key verbatim (e.g. `AIENG-2310`).
    - `short-desc`: kebab-case 2-5 word summary. Lowercase letters, digits,
      and hyphens only.
    </format>

    <examples>
    - `feat/AIENG-2310-state-clear-command`
    - `fix/AIENG-1180-token-refresh-race`
    - `refactor/AIENG-905-extract-run-lifecycle`
    </examples>
  schema:
    type: object
    properties:
      name:
        type: string
        pattern: "^(feat|fix|chore|docs|refactor|test)/[A-Z]+-[0-9]+-[a-z0-9-]+$"
    required: [name]

steps:
  - name: implement
    model: claude-sonnet-4-6
    prompt: |
      You are working issue {{ issue.key }} end-to-end on branch
      `{{ branch }}`, cut from `{{ base_branch }}`.

      <issue title="{{ issue.title }}">
      {{ issue.description }}
      </issue>

      Use the `la-implement` skill.

  - name: review
    model: claude-opus-4-7
    prompt: |
      Review the work on branch `{{ branch }}` against `{{ base_branch }}`
      for issue {{ issue.key }}.

      <issue title="{{ issue.title }}">
      {{ issue.description }}
      </issue>

      <files_changed>
      !`git diff --name-status origin/{{ base_branch }}...HEAD`
      </files_changed>

      <commits>
      !`git log origin/{{ base_branch }}..HEAD --oneline`
      </commits>

      Use the `la-review` skill. The file list and commit list above are
      pre-loaded — pass them through to the sub-agents along with the
      diff command `git diff origin/{{ base_branch }}...HEAD`. Apply
      fixes directly to this branch.

  - name: summarise
    model: claude-haiku-4-5
    allowed_tools: [Read, Glob, Grep]
    prompt: |
      <task>
      Write a reviewer-facing summary of the change on branch
      `{{ branch }}` for issue {{ issue.key }}: {{ issue.title }}.
      </task>

      <commits>
      !`git log origin/{{ base_branch }}..HEAD --oneline`
      </commits>

      <diff base="origin/{{ base_branch }}" head="HEAD">
      !`git diff origin/{{ base_branch }}...HEAD`
      </diff>

      Produce:

      - `type`: one of `feat`, `fix`, `chore`, `docs`, `refactor`, `test`.
      - `description`: one line, written as an imperative title-cased summary
        without a trailing period (e.g. `Add state clear command`).
      - `body`: short markdown for the human reviewing the change request.
        Lead with the user-visible change and why, then implementation
        notes worth a reviewer's attention. Skip the commit-by-commit
        recap — reviewers can read the commit list themselves.
    output_schema:
      type: object
      properties:
        type:
          type: string
          enum: [feat, fix, chore, docs, refactor, test]
        description: { type: string }
        body: { type: string }
      required: [type, description, body]

change_request:
  title: "{{ steps.summarise.output.type }}: {{ issue.key }} - {{ steps.summarise.output.description }}"
  body: |
    Closes {{ issue.key }}: {{ issue.title }}.

    {{ steps.summarise.output.body }}
