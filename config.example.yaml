tracker:
  kind: jira
  base_url: https://nhollas.atlassian.net/
  project: KAN
  trigger_label: local-agents
  statuses:
    pending: "To Do"
    running: "In Progress"
    awaiting_review: "In Review"

code_host:
  kind: github
  scopes:
    - Nhollas

defaults:
  polling_interval_ms: 30000
  max_concurrent: 2
  workspace_root: /tmp/local-agent-workspaces
