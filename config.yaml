tracker:
  kind: jira
  base_url: todo
  project: AIENG
  trigger_label: local-agents
  statuses:
    pending: "To Do"
    running: "In Progress"
    awaiting_review: "In Review"

code_host:
  kind: gitlab
  base_url: https://gitlab.com
  scopes:
    - todo

defaults:
  polling_interval_ms: 30000
  max_concurrent: 2
  max_retries: 3
  model: claude-sonnet-4-6
  workspace_root: /tmp/local-agent-workspaces
