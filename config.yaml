tracker:
  kind: jira
  base_url: todo
  project: AIENG
  statuses:
    pending: "To Do"
    running: "In Progress"
    awaiting_review: "In Review"
  labels:
    - software-factory-poc

code_host:
  kind: gitlab
  base_url: https://gitlab.com
  repos:
    - todo

defaults:
  polling_interval_ms: 30000
  max_concurrent: 2
  max_retries: 3
  model: claude-sonnet-4-6
  workspace_root: /tmp/local-agent-workspaces
